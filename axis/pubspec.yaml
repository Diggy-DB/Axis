name: axis
description: A multi-platform life operating system for iOS, iPadOS, and macOS
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.1
  
  # Firebase - Latest versions with Xcode 15/16 support
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_analytics: ^11.3.3
  cloud_functions: ^5.1.3
  
  # Routing
  go_router: ^13.0.0
  
  # UI Components
  cupertino_icons: ^1.0.6
  flutter_slidable: ^3.0.1
  shimmer: ^3.0.0
  fl_chart: ^0.66.0
  
  # Date/Time
  intl: ^0.18.1
  table_calendar: ^3.0.9
  
  # Local Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Network
  http: ^1.2.0
  dio: ^5.4.0
  
  # Utilities
  uuid: ^4.3.3
  equatable: ^2.0.5
  collection: ^1.18.0
  flutter_dotenv: ^5.1.0
  
  # Icons
  font_awesome_flutter: ^10.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true
  
  # Assets
  assets:
    - assets/images/
    - assets/icons/
    - .env
  
  # Fonts
  # fonts:
  #   - family: SF Pro Display
  #     fonts:
  #       - asset: fonts/SF-Pro-Display-Regular.otf
  #       - asset: fonts/SF-Pro-Display-Medium.otf
  #         weight: 500
  #       - asset: fonts/SF-Pro-Display-Semibold.otf
  #         weight: 600
  #       - asset: fonts/SF-Pro-Display-Bold.otf
  #         weight: 700
